[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-agent-core"
dynamic = ["version"]
description = "Contratos centrais independentes de provedor para o Atlas Agent Framework"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Jorge Medina" }]
maintainers = [{ name = "Jorge Medina" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.26,<5",
    "packaging>=26.0,<27",
    "pydantic>=2.13,<3",
    "typing-extensions>=4.16,<5",
]

[project.urls]
Repository = "https://github.com/Medicode/ai-agent-framework"
Documentation = "https://github.com/Medicode/ai-agent-framework/tree/main/docs"
Issues = "https://github.com/Medicode/ai-agent-framework/issues"

[tool.hatch.version]
path = "src/atlas_agents/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agents"]

[tool.hatch.build.targets.sdist]
include = ["src/atlas_agents", "LICENSE", "README.md", "pyproject.toml"]
