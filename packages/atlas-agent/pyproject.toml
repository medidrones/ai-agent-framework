[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-agent-framework"
dynamic = ["version"]
description = "Meta-package opcional do ecossistema Atlas Agent Framework"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Jorge Medina" }]
maintainers = [{ name = "Jorge Medina" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["atlas-agent-core~=1.0.0rc4"]

[project.optional-dependencies]
openai = ["atlas-agent-providers[openai]~=1.0.0rc4"]
mcp = ["atlas-agent-mcp~=1.0.0rc4"]
rest = ["atlas-agent-adapters[rest]~=1.0.0rc4"]
grpc = ["atlas-agent-adapters[grpc]~=1.0.0rc4"]
config = ["atlas-agent-config~=1.0.0rc4"]
evaluation = ["atlas-agent-evaluation~=1.0.0rc4"]
full = [
    "atlas-agent-adapters[grpc,rest]~=1.0.0rc4",
    "atlas-agent-config~=1.0.0rc4",
    "atlas-agent-evaluation~=1.0.0rc4",
    "atlas-agent-mcp~=1.0.0rc4",
    "atlas-agent-providers[openai]~=1.0.0rc4",
]

[project.urls]
Repository = "https://github.com/Medicode/ai-agent-framework"
Documentation = "https://github.com/Medicode/ai-agent-framework/tree/main/docs"
Issues = "https://github.com/Medicode/ai-agent-framework/issues"

[tool.hatch.version]
path = "src/atlas_agent/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/atlas_agent", "LICENSE", "README.md", "pyproject.toml"]
