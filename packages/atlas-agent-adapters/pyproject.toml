[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-agent-adapters"
dynamic = ["version"]
description = "Adapters externos REST, gRPC e orientados a eventos para o Atlas"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Jorge Medina" }]
maintainers = [{ name = "Jorge Medina" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "atlas-agent-core~=1.0.0",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
rest = ["fastapi>=0.141,<1"]
grpc = ["grpcio>=1.81.1,<2", "protobuf>=6.33.5,<7"]

[project.urls]
Repository = "https://github.com/Medicode/ai-agent-framework"
Documentation = "https://github.com/Medicode/ai-agent-framework/tree/main/docs/adapters"
Issues = "https://github.com/Medicode/ai-agent-framework/issues"

[tool.hatch.version]
path = "src/atlas_agents/adapters/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agents"]

[tool.hatch.build.targets.wheel.force-include]
"proto/atlas_agents/adapters/grpc/v1/agent_execution.proto" = "atlas_agents/adapters/grpc/v1/agent_execution.proto"

[tool.hatch.build.targets.sdist]
include = ["src/atlas_agents/adapters", "proto", "LICENSE", "README.md", "pyproject.toml"]
