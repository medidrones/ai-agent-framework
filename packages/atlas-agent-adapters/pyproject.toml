[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-agent-adapters"
version = "0.1.0"
description = "Adapters externos REST, gRPC e orientados a eventos para o Atlas"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jorge Medina" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "atlas-agent-core>=0.1.0",
    "fastapi>=0.116,<1",
    "grpcio>=1.74,<2",
    "protobuf>=6.31,<7",
]

[project.urls]
Repository = "https://github.com/Medicode/ai-agent-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agents"]

[tool.hatch.build.targets.wheel.force-include]
"proto/atlas_agents/adapters/grpc/v1/agent_execution.proto" = "atlas_agents/adapters/grpc/v1/agent_execution.proto"

[tool.hatch.build.targets.sdist]
include = ["src/atlas_agents/adapters", "proto", "tests", "pyproject.toml"]
