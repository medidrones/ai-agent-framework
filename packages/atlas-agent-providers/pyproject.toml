[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-agent-providers"
version = "0.1.0"
description = "Providers oficiais opcionais para o Atlas Agent Framework"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jorge Medina" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "atlas-agent-core>=0.1.0",
    "openai>=3.13.0,<4",
    "pydantic>=2.10",
]

[project.entry-points."atlas_agents.plugins"]
openai = "atlas_agents.providers.openai:create_plugin"

[project.urls]
Repository = "https://github.com/Medicode/ai-agent-framework"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agents"]

[tool.hatch.build.targets.sdist]
include = ["src/atlas_agents/providers", "tests", "pyproject.toml"]
