apiVersion: v1
kind: Service
metadata:
  name: atlas-worker
  namespace: atlas-ds013
spec:
  selector:
    app.kubernetes.io/name: atlas-worker
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-worker
  namespace: atlas-ds013
  labels:
    app.kubernetes.io/name: atlas-worker
    app.kubernetes.io/version: "1.0.1"
spec:
  replicas: 2
  minReadySeconds: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-worker
        app.kubernetes.io/component: certification-host
        app.kubernetes.io/version: "1.0.1"
      annotations:
        atlas.medicode.dev/promotion: ds-013
    spec:
      serviceAccountName: atlas-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-approval-volume
          image: atlas-ds013:1.0.1
          imagePullPolicy: Never
          command: ["sh", "-c", "chown 10001:10001 /approvals && chmod 0700 /approvals"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          volumeMounts:
            - name: approval-state
              mountPath: /approvals
      containers:
        - name: worker
          image: atlas-ds013:1.0.1
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: atlas-worker-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ATLAS_POSTGRESQL_DSN
              valueFrom:
                secretKeyRef:
                  name: atlas-ds013-credentials
                  key: postgresql-dsn
            - name: ATLAS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-ds013-credentials
                  key: redis-url
            - name: ATLAS_TOKEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-ds013-credentials
                  key: token-hmac-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command:
                - atlas-kubernetes-client
                - GET
                - /ready
                - --base-url
                - http://127.0.0.1:8080
            periodSeconds: 2
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - atlas-kubernetes-client
                - GET
                - /live
                - --base-url
                - http://127.0.0.1:8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 2"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: approval-state
              mountPath: /var/lib/atlas/approvals
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: approval-state
          persistentVolumeClaim:
            claimName: atlas-approval-state
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
