[project]
name = "atlas-agent-framework-workspace"
version = "0.1.0"
description = "Configuração do workspace do Atlas Agent Framework"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
atlas-agent-core = { workspace = true }

[dependency-groups]
dev = [
    "atlas-agent-core",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["packages/atlas-agent-core/src"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"packages/atlas-agent-core/src/atlas_agents/events/types.py" = ["A005"]
"packages/atlas-agent-core/tests/**/*.py" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["packages"]
exclude = ['(^|/)build(/|$)']

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=atlas_agents",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"
testpaths = ["packages/atlas-agent-core/tests"]

[tool.coverage.run]
branch = true
source = ["atlas_agents"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
