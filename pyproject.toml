[project]
name = "atlas-agent-framework-workspace"
version = "0.1.0"
description = "Configuração do workspace do Atlas Agent Framework"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
atlas-agent-core = { workspace = true }
atlas-agent-adapters = { workspace = true }
atlas-agent-evaluation = { workspace = true }
atlas-agent-mcp = { workspace = true }
atlas-agent-providers = { workspace = true }

[dependency-groups]
dev = [
    "atlas-agent-adapters",
    "atlas-agent-core",
    "atlas-agent-evaluation",
    "atlas-agent-mcp",
    "atlas-agent-providers",
    "grpcio-tools>=1.74,<2",
    "httpx>=0.28,<1",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-jsonschema>=4.23",
    "types-grpcio>=1.0",
    "types-protobuf>=6.30",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "packages/atlas-agent-adapters/src/atlas_agents/adapters/grpc/v1/agent_execution_pb2.py",
    "packages/atlas-agent-adapters/src/atlas_agents/adapters/grpc/v1/agent_execution_pb2.pyi",
    "packages/atlas-agent-adapters/src/atlas_agents/adapters/grpc/v1/agent_execution_pb2_grpc.py",
]
src = [
    "packages/atlas-agent-adapters/src",
    "packages/atlas-agent-core/src",
    "packages/atlas-agent-evaluation/src",
    "packages/atlas-agent-mcp/src",
    "packages/atlas-agent-providers/src",
]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"packages/atlas-agent-core/src/atlas_agents/events/types.py" = ["A005"]
"packages/atlas-agent-adapters/src/atlas_agents/adapters/grpc/server.py" = ["N802"]
"packages/*/tests/**/*.py" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
    "packages/atlas-agent-adapters/src",
    "packages/atlas-agent-core/src",
    "packages/atlas-agent-evaluation/src",
    "packages/atlas-agent-mcp/src",
    "packages/atlas-agent-providers/src",
]
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["packages"]
exclude = ['(^|/)build(/|$)']

[[tool.mypy.overrides]]
module = [
    "atlas_agents.adapters.grpc.v1.agent_execution_pb2",
    "atlas_agents.adapters.grpc.v1.agent_execution_pb2_grpc",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=atlas_agents",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"
testpaths = [
    "packages/atlas-agent-adapters/tests",
    "packages/atlas-agent-core/tests",
    "packages/atlas-agent-evaluation/tests",
    "packages/atlas-agent-mcp/tests",
    "packages/atlas-agent-providers/tests",
]

[tool.coverage.run]
branch = true
source = ["atlas_agents"]
omit = [
    "*/adapters/grpc/v1/agent_execution_pb2.py",
    "*/adapters/grpc/v1/agent_execution_pb2_grpc.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
