name: Publicação oficial no PyPI

on:
  workflow_dispatch:
    inputs:
      lote:
        description: Lote autorizado para publicação
        required: true
        type: choice
        options:
          - fundacao
          - integracoes
          - final

concurrency:
  group: atlas-pypi-1.0.1
  cancel-in-progress: false

permissions: {}

jobs:
  verificar-bundle:
    name: Conferir fonte e artefatos certificados
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.selecionar-lote.outputs.matrix }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Exigir execução manual na branch principal
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Conferir tag anotada e versão
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.0.1
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir fonte imutável
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t v1.0.1)" = tag
          test "$(git rev-list -n 1 v1.0.1)" = "43fd7008f8573f2b2a9906ee8c257986777f04e9"
          test "$(cat VERSION)" = "1.0.1"

      - name: Conferir execução e baixar bundle certificado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Conferindo execução certificada"
          run_json=$(gh api repos/medidrones/ai-agent-framework/actions/runs/35017413644)
          test "$(jq -r '.status' <<< "$run_json")" = completed
          test "$(jq -r '.conclusion' <<< "$run_json")" = success
          test "$(jq -r '.head_sha' <<< "$run_json")" = "43fd7008f8573f2b2a9906ee8c257986777f04e9"
          echo "Conferindo artefato certificado"
          artifact_json=$(gh api repos/medidrones/ai-agent-framework/actions/artifacts/10416406388)
          test "$(jq -r '.name' <<< "$artifact_json")" = atlas-release-candidate
          test "$(jq -r '.expired' <<< "$artifact_json")" = false
          test "$(jq -r '.workflow_run.id' <<< "$artifact_json")" = 35017413644
          echo "Baixando bundle certificado"
          gh run download 35017413644 --repo medidrones/ai-agent-framework \
            --name atlas-release-candidate --dir certificado

      - name: Conferir integridade e inventário
        shell: bash
        run: |
          set -euo pipefail
          cd certificado/dist
          test "$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" = "5931aa6a6a66c923831cae1dfeba96571eb10fb812c1cd8816fd0d707aa1094d"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 16
          test "$(wc -l < SHA256SUMS)" -eq 15
          test "$(find . -maxdepth 1 -name '*.whl' | wc -l)" -eq 7
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 7
          sha256sum --check SHA256SUMS
          jq -e '.bomFormat == "CycloneDX" and .metadata.component.version == "1.0.1"' \
            atlas-agent-framework.cdx.json

      - name: Exigir publicação e hashes dos lotes anteriores
        shell: bash
        env:
          LOTE: ${{ inputs.lote }}
        run: |
          set -euo pipefail
          case "$LOTE" in
            fundacao) predecessors=() ;;
            integracoes)
              predecessors=(
                atlas-agent-core:atlas_agent_core
                atlas-agent-adapters:atlas_agent_adapters
                atlas-agent-config:atlas_agent_config
              ) ;;
            final)
              predecessors=(
                atlas-agent-core:atlas_agent_core
                atlas-agent-adapters:atlas_agent_adapters
                atlas-agent-config:atlas_agent_config
                atlas-agent-evaluation:atlas_agent_evaluation
                atlas-agent-framework:atlas_agent_framework
                atlas-agent-mcp:atlas_agent_mcp
              ) ;;
            *) exit 1 ;;
          esac
          cd certificado/dist
          for entry in "${predecessors[@]}"; do
            IFS=: read -r project distribution <<< "$entry"
            curl --fail --silent --show-error --retry-all-errors --retry 12 \
              --retry-delay 5 \
              "https://pypi.org/pypi/${project}/1.0.1/json" > "${project}.json"
            test "$(jq '.urls | length' "${project}.json")" -eq 2
            test "$(grep -c "  ${distribution}-1.0.1" SHA256SUMS)" -eq 2
            while read -r expected filename; do
              test "$(jq -r --arg filename "$filename" \
                '.urls[] | select(.filename == $filename) | .digests.sha256' \
                "${project}.json")" = "$expected"
            done < <(grep "  ${distribution}-1.0.1" SHA256SUMS)
            rm -- "${project}.json"
          done

      - name: Selecionar somente o lote autorizado
        id: selecionar-lote
        shell: bash
        env:
          LOTE: ${{ inputs.lote }}
          MATRIZ_FUNDACAO: '{"include":[{"project":"atlas-agent-core","distribution":"atlas_agent_core","environment":"pypi"},{"project":"atlas-agent-adapters","distribution":"atlas_agent_adapters","environment":"pypi-adapters"},{"project":"atlas-agent-config","distribution":"atlas_agent_config","environment":"pypi-config"}]}'
          MATRIZ_INTEGRACOES: '{"include":[{"project":"atlas-agent-evaluation","distribution":"atlas_agent_evaluation","environment":"pypi-evaluation"},{"project":"atlas-agent-framework","distribution":"atlas_agent_framework","environment":"pypi-framework"},{"project":"atlas-agent-mcp","distribution":"atlas_agent_mcp","environment":"pypi-mcp"}]}'
          MATRIZ_FINAL: '{"include":[{"project":"atlas-agent-providers","distribution":"atlas_agent_providers","environment":"pypi-providers"}]}'
        run: |
          set -euo pipefail
          case "$LOTE" in
            fundacao) matrix="$MATRIZ_FUNDACAO" ;;
            integracoes) matrix="$MATRIZ_INTEGRACOES" ;;
            final) matrix="$MATRIZ_FINAL" ;;
            *) exit 1 ;;
          esac
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Transferir somente o bundle verificado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-1.0.1-pypi-verificado
          path: certificado/dist/
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: Publicar ${{ matrix.project }} via OIDC
    needs: verificar-bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.verificar-bundle.outputs.matrix) }}
    environment:
      name: ${{ matrix.environment }}
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Baixar bundle verificado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-1.0.1-pypi-verificado
          path: dist

      - name: Conferir novamente antes do upload
        shell: bash
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          cd dist
          test "$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" = "5931aa6a6a66c923831cae1dfeba96571eb10fb812c1cd8816fd0d707aa1094d"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 16
          test "$(grep -c "  ${DISTRIBUTION}-1.0.1" SHA256SUMS)" -eq 2
          test -f "${DISTRIBUTION}-1.0.1-py3-none-any.whl"
          test -f "${DISTRIBUTION}-1.0.1.tar.gz"
          sha256sum --check SHA256SUMS

      - name: Instalar uv sem acesso ao código-fonte
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Publicar somente os dois arquivos do projeto
        shell: bash
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          uv publish --trusted-publishing always \
            --publish-url https://upload.pypi.org/legacy/ \
            --check-url https://pypi.org/simple/ \
            "dist/${DISTRIBUTION}-1.0.1-py3-none-any.whl" \
            "dist/${DISTRIBUTION}-1.0.1.tar.gz"

      - name: Confirmar os dois hashes no PyPI
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry-all-errors --retry 12 \
            --retry-delay 5 \
            "https://pypi.org/pypi/${PROJECT}/1.0.1/json" > "${PROJECT}.json"
          test "$(jq '.urls | length' "${PROJECT}.json")" -eq 2
          test "$(grep -c "  ${DISTRIBUTION}-1.0.1" dist/SHA256SUMS)" -eq 2
          while read -r expected filename; do
            test "$(jq -r --arg filename "$filename" \
              '.urls[] | select(.filename == $filename) | .digests.sha256' \
              "${PROJECT}.json")" = "$expected"
          done < <(grep "  ${DISTRIBUTION}-1.0.1" dist/SHA256SUMS)
